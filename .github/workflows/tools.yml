name: Tools (manual only)
# 수동 실행 전용 도구. 예측 실행/로그 커밋(predict.yml)과 같은 concurrency 그룹을 써서 서로 겹치지 않게 한다.
on:
  workflow_dispatch:
    inputs:
      tool:
        description: "scorecard = 방향 성적표(읽기 전용) / extaudit = 외부 종가 대조(읽기 전용, external/*.csv) / resettle = 과거 정산 재채점 / btc = 비트코인 선행성 검정 / backtest = 워크포워드 백테스트(읽기 전용) / volbt = 변동성 후보 비교(읽기 전용) / stratsim = 전략 수익률·낙폭 시뮬레이션(읽기 전용) / universe = 확장 종목 백필(읽기 전용) / xsbt = 교차종목 다음날 예측 워크포워드(읽기 전용) / xsmag = 몇 % 오르나 예측 검증(읽기 전용) / xsvar = 개선안·정성 데이터 비교(읽기 전용)"
        required: true
        type: choice
        options: [resettle, btc, backtest, variants, volbt, scorecard, extaudit, stratsim, universe, xsbt, xsmag, xsvar]
      bt_start:
        description: "backtest 전용: 시작일(기본 2026-01-01)"
        required: false
        default: "2026-01-01"
      bt_step:
        description: "backtest 전용: 기준일 간격(거래일, 기본 3)"
        required: false
        default: "3"
      bt_variants:
        description: "variants 전용: 쉼표로 구분한 변형 접두어(예: V0,V1). 비우면 전부"
        required: false
        default: ""
      apply:
        description: "resettle 전용: true 면 로그를 실제로 덮어씀(백업 생성). false 면 dry-run"
        required: false
        type: boolean
        default: false

concurrency:
  group: battery-predictor-single-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 재채점 (dry-run 또는 적용)
        if: ${{ inputs.tool == 'resettle' }}
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            python resettle_logs.py logs --apply
          else
            python resettle_logs.py logs
          fi
      - name: 재채점 결과 커밋 (apply=true 일 때만)
        if: ${{ inputs.tool == 'resettle' && inputs.apply }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python push_logs.py "${GITHUB_REF_NAME}" "chore: re-settle logs with model-aligned scoring (v25) [skip ci]" logs
      - name: BTC 선행성 검정
        if: ${{ inputs.tool == 'btc' }}
        run: |
          mkdir -p reports
          python btc_leadlag_test.py | tee reports/btc_leadlag.txt
      - name: BTC 검정 결과 저장 (reports/btc_leadlag.txt 커밋 — 예측 로그는 건드리지 않음)
        if: ${{ inputs.tool == 'btc' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python push_logs.py "${GITHUB_REF_NAME}" "chore: BTC lead-lag result [skip ci]" reports/btc_leadlag.txt
      - name: 🛟 push 실패 시 로그 보존 (artifact)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-logs
          path: rescue_logs/
          if-no-files-found: ignore
          retention-days: 30
      - name: 워크포워드 백테스트 (로그는 건드리지 않음)
        if: ${{ inputs.tool == 'backtest' }}
        env:
          BT_MAX_SECONDS: "4200"
        run: |
          mkdir -p reports
          python backtest_2026.py "${{ inputs.bt_start }}" "${{ inputs.bt_step }}" reports
      - name: 라벨·보정 수정안 비교 백테스트 (로그는 건드리지 않음)
        if: ${{ inputs.tool == 'variants' }}
        env:
          BT_MAX_SECONDS: "4800"
          BT_VARIANTS: ${{ inputs.bt_variants }}
        run: |
          mkdir -p reports
          python backtest_variants.py "${{ inputs.bt_start }}" "${{ inputs.bt_step }}" reports
      - name: 변형 비교 결과 저장 (reports/ 에만 커밋)
        if: ${{ inputs.tool == 'variants' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python push_logs.py "${GITHUB_REF_NAME}" "chore: variants backtest report [skip ci]" reports/backtest_variants.txt reports/backtest_variants_preds.tsv
      - name: 변동성 후보 워크포워드 비교 (로그는 건드리지 않음)
        if: ${{ inputs.tool == 'volbt' }}
        run: |
          mkdir -p reports
          python backtest_vol.py "TQQQ,SQQQ,SOXL,SOXS,SPXL,SPXS,QQQ,SMH,SPY" 2 reports 2019-01-01
      - name: 변동성 비교 결과 저장 (reports/ 에만 커밋)
        if: ${{ inputs.tool == 'volbt' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python push_logs.py "${GITHUB_REF_NAME}" "chore: volatility candidates backtest report [skip ci]" reports/backtest_vol.txt
      - name: 전략 수익률·낙폭 시뮬레이션 (읽기 전용, 로그는 건드리지 않음)
        if: ${{ inputs.tool == 'stratsim' }}
        run: |
          mkdir -p reports
          python test_v38.py
          python strategy_sim.py live logs reports
          python strategy_sim.py bench reports 2010-01-01
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python push_logs.py "${GITHUB_REF_NAME}" "chore: strategy simulation report [skip ci]" reports/strategy_sim_live.txt reports/strategy_sim_live.json reports/strategy_sim_bench.txt reports/strategy_sim_bench.json
      - name: 확장 종목 백필 (읽기 전용, 로그는 건드리지 않음)
        if: ${{ inputs.tool == 'universe' }}
        run: |
          mkdir -p reports
          python test_v39.py
          python universe_tracker.py backfill reports 2010-01-01
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python push_logs.py "${GITHUB_REF_NAME}" "chore: universe backfill report [skip ci]" reports/universe_backfill.txt reports/universe_backfill.json
      - name: 교차종목 다음날 예측 워크포워드 (읽기 전용, 로그는 건드리지 않음)
        if: ${{ inputs.tool == 'xsbt' }}
        run: |
          mkdir -p reports
          python test_v40.py
          python xs_predictor.py backtest reports
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python push_logs.py "${GITHUB_REF_NAME}" "chore: xs backtest report [skip ci]" reports/xs_backtest.txt reports/xs_backtest.json
      - name: 몇 % 오르나 예측 검증 (읽기 전용, 로그는 건드리지 않음)
        if: ${{ inputs.tool == 'xsmag' }}
        run: |
          mkdir -p reports
          python test_v41.py
          python xs_magnitude.py reports
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python push_logs.py "${GITHUB_REF_NAME}" "chore: xs magnitude report [skip ci]" reports/xs_magnitude.txt reports/xs_magnitude.json
      - name: 개선안·정성 데이터 비교 (읽기 전용, 로그는 건드리지 않음)
        if: ${{ inputs.tool == 'xsvar' }}
        run: |
          mkdir -p reports
          pip install lxml >/dev/null 2>&1 || true
          python test_v42.py
          python xs_variants.py reports
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python push_logs.py "${GITHUB_REF_NAME}" "chore: xs variants report [skip ci]" reports/xs_variants.txt reports/xs_variants.json
      - name: 방향 성적표 · 외부 종가 대조 (로그는 건드리지 않음)
        if: ${{ inputs.tool == 'scorecard' || inputs.tool == 'extaudit' }}
        run: |
          mkdir -p reports
          if [ "${{ inputs.tool }}" = "scorecard" ]; then
            python direction_scorecard.py logs reports
          else
            f=$(ls external/*.csv 2>/dev/null | sort | tail -n 1)
            if [ -z "$f" ]; then echo "external/*.csv 가 없습니다"; exit 1; fi
            python audit_external_prices.py "$f" logs 0.01 reports
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python push_logs.py "${GITHUB_REF_NAME}" "chore: read-only audit report [skip ci]" reports
      - name: 백테스트 결과 저장 (reports/ 에만 커밋)
        if: ${{ inputs.tool == 'backtest' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python push_logs.py "${GITHUB_REF_NAME}" "chore: backtest report [skip ci]" reports/backtest_2026.txt reports/backtest_2026.json reports/backtest_2026_preds.tsv
