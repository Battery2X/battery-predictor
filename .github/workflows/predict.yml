name: Run Battery Predictor (v13.0 Optimized)

on:
  schedule:
    # 1. KST 오전 08:40 (UTC 전날 23:40) - 월~금 아침 브리핑
    - cron: '40 23 * * 0-4'
    # 2. KST 오후 02:40 (UTC 당일 05:40) - 월~금 장 마감 전 통제
    - cron: '40 05 * * 1-5'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # 지연 대비 시간 연장
    
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install finance-datareader yfinance pandas numpy scikit-learn requests

      - name: 2차전지 레버리지 정밀 분석 실행
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python predict.py
