name: Run US AI/Semi Predictor

on:
  workflow_dispatch: # 자동화(스케줄)를 없애고 수동 실행 버튼만 남김

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v7

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: pip 캐시 설정
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📊 단기 분석 실행 (predict.py)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python predict.py

      - name: 🦅 장기 매크로 분석 실행 (predict_long.py)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python predict_long.py

      - name: ⚛️ 양자컴퓨팅 분석 실행 (predict_quantum.py)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python predict_quantum.py
