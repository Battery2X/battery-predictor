name: Run Battery Predictor (v13.0 Optimized)

on:
  schedule:
    # 1. KST 오전 08:40 (UTC 전날 23:40) - 월~금 아침 브리핑
    - cron: '40 23 * * 0-4'
    # 2. KST 오후 02:40 (UTC 당일 05:40) - 월~금 장 마감 전 통제
    - cron: '40 05 * * 1-5'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 10분 이상 지연 시 자동 종료 (안전 장치)
    
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 라이브러리 설치 속도 최적화

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install finance-datareader yfinance pandas numpy scikit-learn requests

      - name: 2차전지 레버리지 정밀 분석 실행
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1" # 파이썬 로그 즉시 출력
        # 🚨 실패하더라도 텔레그램으로 에러 메시지를 보내도록 스크립트 내부에서 처리하므로 continue-on-error는 유지
        continue-on-error: true
        run: python predict.py
