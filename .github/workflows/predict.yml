name: Run Battery Predictor (v13.0 Optimized)
on:
  schedule:
    # 1. KST 오전 08:40 (버퍼 30분 적용 → UTC 23:10, 일~목)
    - cron: '10 23 * * 0-4'
    # 2. KST 오후 02:40 (버퍼 30분 적용 → UTC 05:10, 월~금)
    - cron: '10 05 * * 1-5'
    # 3. 레포 비활성화 방지 (매월 1일 UTC 00:00)
    - cron: '0 0 1 * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  keep-alive:
    if: github.event.schedule == '0 0 1 * *'
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 레포 활성 상태 유지
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(date)" >> keep_alive.txt
          git add keep_alive.txt
          git commit -m "chore: keep-alive $(date +'%Y-%m')"
          git push

  build:
    if: github.event.schedule != '0 0 1 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install finance-datareader yfinance pandas numpy scikit-learn requests

      - name: 2차전지 레버리지 정밀 분석 실행
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python predict.py
