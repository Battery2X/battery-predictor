name: Run Battery Predictor

on:
  schedule:
    # KST 오전 08:40 (UTC 전날 23:40)에 자동 실행
    - cron: '40 23 * * *' 
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Node.js 관련 경고를 방지하기 위한 환경 변수
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필요 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install finance-datareader yfinance pandas numpy scikit-learn requests

      - name: 예측 스크립트 실행
        env:
          # GitHub Secrets에서 보안 값 호출
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        continue-on-error: true
        run: python predict.py
