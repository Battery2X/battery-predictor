name: Run Leveraged ETF & Stock Predictor
on:
  schedule:
    # 매 정각은 GitHub 서버 부하로 지연되기 쉬워서 17분에 배치.
    # UTC 00:17 = 한국시간(KST) 09:17.
    # 화~토(2-6)에 실행 => 미국장 월~금 마감분을 다음날 아침에 반영.
    - cron: '17 0 * * 2-6'
  workflow_dispatch: # 수동 실행 버튼도 그대로 유지

# 동시에 두 실행이 겹치면 logs/ 커밋이 서로 충돌해서 기록이 유실될 수 있음
# (실제로 겪었던 문제). 새 실행이 들어오면 이전 실행이 끝날 때까지 대기시켜서
# 겹치는 걸 원천 차단한다. cancel-in-progress:false = 취소하지 않고 순서대로 대기.
concurrency:
  group: battery-predictor-single-run
  cancel-in-progress: false

permissions:
  contents: write  # logs/ 폴더를 커밋해서 다시 push하기 위해 필요

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v7
      - name: 파이썬 환경 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: pip 캐시 설정
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---- 레버리지/인버스 ETF (TQQQ/SQQQ, SOXL/SOXS, SPXL/SPXS) ----
      - name: ⚡ 단타 분석 실행 (predict_scalp.py, 1일 호라이즌)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python predict_scalp.py
      - name: 📈 스윙 분석 실행 (predict_swing.py, 5일 호라이즌)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python predict_swing.py
      - name: 🏔️ 포지션 분석 실행 (predict_position.py, 20일 호라이즌)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python predict_position.py

      # ---- 개별 종목 (AAPL/NVDA/TSLA) ----
      - name: 🍎 종목-단타 분석 실행 (predict_stock_scalp.py, 1일 호라이즌)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python predict_stock_scalp.py
      - name: 🍎 종목-스윙 분석 실행 (predict_stock_swing.py, 5일 호라이즌)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python predict_stock_swing.py
      - name: 🍎 종목-포지션 분석 실행 (predict_stock_position.py, 20일 호라이즌)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python predict_stock_position.py

      - name: 📝 예측 로그 커밋 (실전 적중률 추적용 + 저장소 활성 상태 유지)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update prediction logs [skip ci]"
            # concurrency 설정으로 겹치는 실행은 막았지만, 혹시 모를 충돌에
            # 대비해 push 전에 원격 최신본을 먼저 받아 리베이스한다.
            git pull --rebase origin "${GITHUB_REF_NAME}" || git rebase --abort
            git push
          else
            echo "변경된 로그 없음 — 커밋 스킵"
          fi
