name: Run US AI/Semi Predictor (Short, Long & Quantum)
on:
  schedule:
    # 1. KST 밤 10:15 (미국장 개장 15분 전) → UTC 13:15, 월~금
    - cron: '15 13 * * 1-5'
    
    # 2. KST 아침 05:15 (미국장 마감 15분 후) → UTC 20:15, 화~토
    - cron: '15 20 * * 2-6'
    
    # 3. 레포 비활성화 방지 (매월 1일 UTC 00:00)
    - cron: '0 0 1 * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  keep-alive:
    if: github.event.schedule == '0 0 1 * *'
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 레포 활성 상태 유지
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(date)" >> keep_alive.txt
          git add keep_alive.txt
          git commit -m "chore: keep-alive $(date +'%Y-%m')"
          git push

  build:
    if: github.event.schedule != '0 0 1 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy scikit-learn requests

      - name: US AI·반도체 정밀 분석 실행 (단기)
        env:
          TELEGRAM
