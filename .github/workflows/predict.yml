name: Run Battery Predictor

on:
  schedule:
    # KST 오전 8:50 (UTC 기준 전날 오후 11:50)에 자동으로 실행됩니다.
    - cron: '50 23 * * *' 
  workflow_dispatch: # Actions 탭에서 수동으로 즉시 실행할 수 있는 버튼을 생성합니다.

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 최근 발생한 Node.js 20 권장 환경 경고를 해결하기 위해 
    # 내부 엔진을 Node.js 24로 강제 설정하는 옵션을 추가했습니다.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 저장소 코드 불러오기
        # Node.js 24를 지원하는 최신 v4 버전으로 업데이트했습니다.
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        # Node.js 24를 지원하는 최신 v5 버전으로 업데이트했습니다.
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # 라이브러리 설치 속도를 높이기 위해 캐싱 기능을 추가했습니다.
          cache: 'pip'

      - name: 필요 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install finance-datareader yfinance pandas numpy scikit-learn requests

      - name: 예측 스크립트 실행 (디버깅 모드)
        env:
          # GitHub Secrets에 등록한 토큰과 ID를 안전하게 가져옵니다.
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 로그 버퍼링을 해제하여 에러 발생 시 즉시 화면에 출력되게 합니다.
          PYTHONUNBUFFERED: "1"
        # 에러가 발생하더라도 로그를 끝까지 남기도록 설정했습니다.
        continue-on-error: true
        run: python predict.py
