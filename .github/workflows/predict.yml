name: Run Leveraged ETF Predictor
on:
  workflow_dispatch: # 자동화(스케줄)를 없애고 수동 실행 버튼만 남김

permissions:
  contents: write  # logs/ 폴더를 커밋해서 다시 push하기 위해 필요

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v7
      - name: 파이썬 환경 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: pip 캐시 설정
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: ⚡ 단타 분석 실행 (predict_scalp.py, 1일 호라이즌)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python predict_scalp.py
      - name: 📈 스윙 분석 실행 (predict_swing.py, 5일 호라이즌)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python predict_swing.py
      - name: 🏔️ 포지션 분석 실행 (predict_position.py, 20일 호라이즌)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python predict_position.py
      - name: 📝 예측 로그 커밋 (실전 적중률 추적용)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update prediction logs [skip ci]"
            git push
          else
            echo "변경된 로그 없음 — 커밋 스킵"
          fi
