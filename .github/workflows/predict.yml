- name: 예측 실행
        run: |
          python predict.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        continue-on-error: true

      - name: 에러 확인
        run: |
          python -c "
import sys
print('Python 버전:', sys.version)
try:
    import predict
except Exception as e:
    print('에러 발생:', e)
    import traceback
    traceback.print_exc()
"
