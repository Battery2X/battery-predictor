name: Run Leveraged ETF & Stock Predictor
on:
  schedule:
    # 매 정각은 GitHub 서버 부하로 지연되기 쉬워서 17분에 배치.
    # UTC 00:17 = 한국시간(KST) 09:17.
    # 화~토(2-6)에 실행 => 미국장 월~금 마감분을 다음날 아침에 반영.
    - cron: '17 0 * * 2-6'
  workflow_dispatch: # 수동 실행 버튼도 그대로 유지

# 동시에 두 실행이 겹치면 logs/ 커밋이 서로 충돌해서 기록이 유실될 수 있음
# (실제로 겪었던 문제). 새 실행이 들어오면 이전 실행이 끝날 때까지 대기시켜서
# 겹치는 걸 원천 차단한다. cancel-in-progress:false = 취소하지 않고 순서대로 대기.
concurrency:
  group: battery-predictor-single-run
  cancel-in-progress: false

permissions:
  contents: write  # logs/ 폴더를 커밋해서 다시 push하기 위해 필요

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v7
      - name: 파이썬 환경 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: pip 캐시 설정
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---- 레버리지/인버스 ETF (TQQQ/SQQQ, SOXL/SOXS, SPXL/SPXS) ----
      - name: ⚡ 단타 분석 실행 (predict_scalp.py, 1일 호라이즌)
        continue-on-error: true
        timeout-minutes: 10   # v29: 시세 서버 무응답 등으로 한 단계가 멈춰도 나머지 단계와 로그 커밋이 진행되게
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python predict_scalp.py
      - name: 📈 스윙 분석 실행 (predict_swing.py, 5일 호라이즌)
        continue-on-error: true
        timeout-minutes: 10   # v29: 시세 서버 무응답 등으로 한 단계가 멈춰도 나머지 단계와 로그 커밋이 진행되게
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python predict_swing.py
      - name: 🏔️ 포지션 분석 실행 (predict_position.py, 20일 호라이즌)
        continue-on-error: true
        timeout-minutes: 10   # v29: 시세 서버 무응답 등으로 한 단계가 멈춰도 나머지 단계와 로그 커밋이 진행되게
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python predict_position.py

      # ---- 개별 종목 (AAPL/NVDA/TSLA) ----
      - name: 🍎 종목-단타 분석 실행 (predict_stock_scalp.py, 1일 호라이즌)
        continue-on-error: true
        timeout-minutes: 10   # v29: 시세 서버 무응답 등으로 한 단계가 멈춰도 나머지 단계와 로그 커밋이 진행되게
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python predict_stock_scalp.py
      - name: 🍎 종목-스윙 분석 실행 (predict_stock_swing.py, 5일 호라이즌)
        continue-on-error: true
        timeout-minutes: 10   # v29: 시세 서버 무응답 등으로 한 단계가 멈춰도 나머지 단계와 로그 커밋이 진행되게
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python predict_stock_swing.py
      - name: 🍎 종목-포지션 분석 실행 (predict_stock_position.py, 20일 호라이즌)
        continue-on-error: true
        timeout-minutes: 10   # v29: 시세 서버 무응답 등으로 한 단계가 멈춰도 나머지 단계와 로그 커밋이 진행되게
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python predict_stock_position.py

      # ---- 쉬운 요약 리포트 (6개 실행 후, 로그는 읽기만 함 → 검증 시계 영향 없음) ----
      - name: 🧭 쉬운 요약 리포트 (daily_summary.py, 위험판·일정·핫이슈·뉴스)
        continue-on-error: true
        timeout-minutes: 10   # v29: 시세 서버 무응답 등으로 한 단계가 멈춰도 나머지 단계와 로그 커밋이 진행되게
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python daily_summary.py

      - name: 📝 예측 로그 커밋 (실전 적중률 추적용 + 저장소 활성 상태 유지)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # v28: push 가 거절되면(원격이 먼저 앞서간 경우 등) CSV 를 행 단위로 합쳐 재시도한다.
          # 끝내 실패하면 rescue_logs/ 에 보존하고 실패 처리 → 아래 artifact 단계가 저장.
          python push_logs.py "${GITHUB_REF_NAME}" "chore: update prediction logs [skip ci]" logs reports

      - name: 🛟 push 실패 시 로그 보존 (artifact)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-logs
          path: rescue_logs/
          if-no-files-found: ignore
          retention-days: 30

      # ---- 건강 점검: 분석 단계가 전부 continue-on-error 라서 '조용한 실패'를 여기서 잡는다 (v27) ----
      - name: 🩺 실행 건강 점검 (health_check.py — 로그 누락·정체 시 텔레그램 알림 + 실패 처리)
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python health_check.py
