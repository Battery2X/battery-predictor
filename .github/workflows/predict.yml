name: Run Battery Predictor

on:
  schedule:
    - cron: '50 23 * * *' 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 이 옵션이 핵심입니다. 모든 액션을 강제로 Node.js 24 환경에서 돌립니다.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필요 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install finance-datareader yfinance pandas numpy scikit-learn requests

      - name: 예측 스크립트 실행
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        continue-on-error: true
        run: python predict.py
