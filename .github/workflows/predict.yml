name: Run US AI/Semi Predictor (Short, Long & Quantum)

on:
  schedule:
    # 1. KST 밤 10:15 (미국장 개장 15분 전) → UTC 13:15, 월~금
    - cron: '15 13 * * 1-5'

    # 2. KST 아침 06:15 (미국장 마감 후 안전권) → UTC 21:15, 화~토
    #    여름(EDT): 마감 UTC 20:00 → 실행 75분 후 ✅
    #    겨울(EST): 마감 UTC 21:00 → 실행 15분 후 ✅
    #    기존 20:15는 겨울 기준 마감 45분 전 실행 버그 있었음
    - cron: '15 21 * * 2-6'

    # 3. 레포 비활성화 방지 (매월 1일 UTC 00:00)
    - cron: '0 0 1 * *'

  workflow_dispatch:

jobs:
  # ============================================================
  # JOB 1: 레포 활성 유지 (월 1회)
  # ============================================================
  keep-alive:
    if: github.event.schedule == '0 0 1 * *'
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 레포 활성 상태 유지
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(date)" >> keep_alive.txt
          git add keep_alive.txt
          git commit -m "chore: keep-alive $(date +'%Y-%m')"
          git push

  # ============================================================
  # JOB 2: 퀀트 분석 실행 (평일 장전/장후)
  # ============================================================
  build:
    if: |
      github.event.schedule == '15 13 * * 1-5' ||
      github.event.schedule == '15 21 * * 2-6' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Gemini B안 채택: requirements.txt 해시 기반 캐시
      # → 라이브러리 변경 시 파일만 수정하면 자동 캐시 갱신
      - name: pip 캐시 설정
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📊 단기 분석 실행 (predict.py)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python predict.py

      - name: 🦅 장기 매크로 분석 실행 (predict_long.py)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python predict_long.py

      - name: ⚛️ 양자컴퓨팅 분석 실행 (predict_quantum.py)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python predict_quantum.py
